# PATTERN 1 — SIDECAR
#
#   app      writes an access log into a shared emptyDir
#   shipper  tails that file and re-emits it on ITS OWN stdout
#
# The two containers share a network namespace and the `varlog` volume, but NOT
# a filesystem root and NOT a process namespace. The only coupling is the
# volume, which is exactly what makes the pattern reusable.
apiVersion: v1
kind: Pod
metadata:
  name: depot-sidecar
  namespace: kcna-lab04
  labels:
    app.kubernetes.io/name: depot-api
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/lab: lab-04
    kcna.tertiaryinfotech.com/pattern: sidecar
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 3000
    seccompProfile:
      type: RuntimeDefault
  containers:
    # ---------------------------------------------------------------- app ---
    - name: app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          cp /seed/access-seed.log /var/log/depot/access.log
          echo "[app] seeded `grep -c . /var/log/depot/access.log` historical rows"
          while true; do
            for code in 200 200 200 201 200 404 200 503; do
              echo "`date -u +%FT%TZ` depot=MF-SIN-02 path=/api/bookings status=${code} bytes=812 latency_ms=44" \
                >> /var/log/depot/access.log
              sleep 3
            done
          done
      volumeMounts:
        - name: varlog
          mountPath: /var/log/depot
        - name: seed
          mountPath: /seed
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    # ------------------------------------------------------------ shipper ---
    - name: shipper
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[shipper] waiting for /var/log/depot/access.log"
          while [ ! -f /var/log/depot/access.log ]; do sleep 1; done
          echo "[shipper] shipping to stdout (a real shipper would POST to a log backend)"
          exec tail -n +1 -F /var/log/depot/access.log
      volumeMounts:
        - name: varlog
          mountPath: /var/log/depot
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: varlog
      emptyDir:
        sizeLimit: 16Mi
    - name: seed
      configMap:
        name: access-seed
        defaultMode: 0444
