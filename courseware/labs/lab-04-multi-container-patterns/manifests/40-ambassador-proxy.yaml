# PATTERN 3 — AMBASSADOR
#
#   app         only ever talks to http://127.0.0.1:9000 — it has no idea the
#               real service exists, no DNS name, no TLS, no retry logic
#   ambassador  listens on localhost:9000 inside the Pod and forwards to
#               tariff-backend.kcna-lab04.svc.cluster.local:80
#
# This works because every container in a Pod shares ONE network namespace:
# they see the same loopback interface and the same Pod IP.
# The ambassador is where you would later add TLS origination, retries,
# circuit breaking or a shard-aware router — without touching the application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambassador-conf
  namespace: kcna-lab04
  labels:
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/lab: lab-04
data:
  default.conf: |
    server {
        listen       9000;
        server_name  localhost;

        # Everything the application asks for on localhost:9000 is forwarded
        # to the real, cluster-internal service.
        location / {
            proxy_pass         http://tariff-backend.kcna-lab04.svc.cluster.local:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Meridian-Via    ambassador;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
        }

        # A local health endpoint the application can poll cheaply.
        location = /ambassador-health {
            add_header Content-Type text/plain;
            return 200 "ambassador ok\n";
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: depot-ambassador
  namespace: kcna-lab04
  labels:
    app.kubernetes.io/name: depot-api
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/lab: lab-04
    kcna.tertiaryinfotech.com/pattern: ambassador
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 10
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    # ---------------------------------------------------------------- app ---
    - name: app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[app] I only know about http://127.0.0.1:9000"
          while true; do
            if wget -q -O /tmp/quote.json http://127.0.0.1:9000/tariff-quote.json 2>/dev/null; then
              echo "[app] quote via ambassador: `grep bay_hour /tmp/quote.json | tr -d ' '`"
            else
              echo "[app] ambassador not ready yet, retrying"
            fi
            sleep 10
          done
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    # --------------------------------------------------------- ambassador ---
    - name: ambassador
      image: nginx:1.27-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - name: proxy
          containerPort: 9000
          protocol: TCP
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /ambassador-health
          port: proxy
        initialDelaySeconds: 2
        periodSeconds: 5
      securityContext:
        allowPrivilegeEscalation: false
  volumes:
    - name: conf
      configMap:
        name: ambassador-conf
