# NATIVE SIDECARS — an initContainer with restartPolicy: Always
#
# Stable since Kubernetes v1.29 (SidecarContainers feature gate on by default;
# GA in v1.33). A restartable init container:
#   * starts BEFORE the regular containers, in list order
#   * keeps running for the whole life of the Pod
#   * does NOT keep the Pod from Completing (important for Jobs)
#   * is terminated AFTER the regular containers, so it can flush its buffer
#
# This Pod has three phases:
#   initContainers[0] prepare  -> classic init container: runs to completion
#   initContainers[1] shipper  -> NATIVE SIDECAR: starts, then stays up
#   containers[0]     app      -> only starts once shipper is started
apiVersion: v1
kind: Pod
metadata:
  name: depot-native-sidecar
  namespace: kcna-lab04
  labels:
    app.kubernetes.io/name: depot-api
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/lab: lab-04
    kcna.tertiaryinfotech.com/pattern: native-sidecar
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 3000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    # Classic init container: no restartPolicy, so it must EXIT 0 before
    # anything else in the Pod starts.
    - name: prepare
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          cp /seed/access-seed.log /var/log/depot/access.log
          echo "[prepare] seeded `grep -c . /var/log/depot/access.log` rows, exiting 0"
      volumeMounts:
        - name: varlog
          mountPath: /var/log/depot
        - name: seed
          mountPath: /seed
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    # NATIVE SIDECAR: restartPolicy: Always on an init container.
    - name: shipper
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      restartPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[shipper] native sidecar up BEFORE the app container"
          exec tail -n +1 -F /var/log/depot/access.log
      volumeMounts:
        - name: varlog
          mountPath: /var/log/depot
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[app] starting AFTER the native sidecar"
          while true; do
            echo "`date -u +%FT%TZ` depot=MF-SIN-02 path=/api/bookings status=200 bytes=812 latency_ms=44" \
              >> /var/log/depot/access.log
            sleep 5
          done
      volumeMounts:
        - name: varlog
          mountPath: /var/log/depot
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: varlog
      emptyDir:
        sizeLimit: 16Mi
    - name: seed
      configMap:
        name: access-seed
        defaultMode: 0444
