# Two identical clients that differ ONLY by one label. That label is the whole
# experiment: role=frontend is allowed to reach payments-api, role=reporting is
# not. Nothing else about the two Pods differs.
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: kcna-lab16
  labels:
    app: shipper-portal
    role: frontend
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: reporting
  namespace: kcna-lab16
  labels:
    app: finance-reporting
    role: reporting
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  restartPolicy: Never
