apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: kcna-lab16
  labels:
    app: payments-api
    tier: backend
    app.kubernetes.io/part-of: meridian-freight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        tier: backend
        app.kubernetes.io/part-of: meridian-freight
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              # 8080 is the POD port. A NetworkPolicy `ports` entry refers to
              # THIS number, never to the Service's port 80 - policy is applied
              # after kube-proxy has already rewritten the destination.
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: payments-content
        - name: nginx-conf
          configMap:
            name: payments-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: kcna-lab16
  labels:
    app: payments-api
spec:
  type: ClusterIP
  selector:
    app: payments-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
