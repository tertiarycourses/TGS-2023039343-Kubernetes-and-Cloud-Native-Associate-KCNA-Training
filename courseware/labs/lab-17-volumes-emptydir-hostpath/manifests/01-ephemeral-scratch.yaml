# Lab 17 / Step 3 — the container filesystem is EPHEMERAL.
#
# This Pod declares NO volume at all. Everything it writes lands in the
# container's writable layer, which the container runtime discards when the
# container is replaced. A container restart need not replace its Pod.
# This exercise removes and recreates the Pod to demonstrate data loss.
apiVersion: v1
kind: Pod
metadata:
  name: lane-scratch
  namespace: kcna-lab17
  labels:
    app.kubernetes.io/name: lane-scratch
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "17"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10017
    runAsGroup: 10017
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: scratch
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          mkdir -p /tmp/tracklane
          echo "scratch-note written at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /tmp/tracklane/notes.txt
          echo "container-layer path: /tmp/tracklane/notes.txt"
          cat /tmp/tracklane/notes.txt
          # Stay alive so the learner can exec in and inspect the file.
          sleep 3600
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: false
        capabilities:
          drop: ["ALL"]
