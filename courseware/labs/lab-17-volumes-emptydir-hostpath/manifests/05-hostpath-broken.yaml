# Lab 17 / FAILURE INJECTION A — deliberately broken.
#
# DO NOT "fix" this file. Apply it, read the event, then delete the Pod.
#
# /mnt/tracklane-archive does not exist on a stock kind node, and
# `type: Directory` tells the kubelet to assert that the path exists AND is a
# directory before mounting. The assertion fails, so the Pod never leaves
# ContainerCreating and the kubelet reports FailedMount events while retrying.
#
# This is the most common hostPath production incident: the manifest works on
# the author's node and fails on every other node in the fleet, because
# hostPath has no scheduling awareness of whether the path exists.
apiVersion: v1
kind: Pod
metadata:
  name: archive-writer-broken
  namespace: kcna-lab17
  labels:
    app.kubernetes.io/name: archive-writer-broken
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "17"
    kcna.tertiaryinfotech.com/intent: failure-injection
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  volumes:
    - name: archive
      hostPath:
        path: /mnt/tracklane-archive
        type: Directory
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo archive-ready && sleep 3600"]
      volumeMounts:
        - name: archive
          mountPath: /archive
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: ["ALL"]
