# Lab 17 / Step 7 — emptyDir.medium: Memory
#
# The kubelet backs this volume with a tmpfs mounted from the node's RAM
# instead of the node's disk. Two consequences the learner must internalise:
#   1. It uses RAM-backed tmpfs (useful for short-lived
#      caches and unix sockets; do not assume swap is disabled).
#   2. Writes COUNT AGAINST the writing container's memory limit. Filling it can get the Pod
#      OOM-killed or evicted, so sizeLimit is not optional in practice.
#
# SizeMemoryBackedVolumes was beta in v1.22 and GA in v1.32; the kubelet sizes
# the tmpfs to sizeLimit, so overfilling fails with ENOSPC rather than
# silently eating node memory. We exercise that in Failure Injection B.
apiVersion: v1
kind: Pod
metadata:
  name: lane-cache
  namespace: kcna-lab17
  labels:
    app.kubernetes.io/name: lane-cache
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "17"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10017
    runAsGroup: 10017
    fsGroup: 10017
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: cache
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi
  containers:
    - name: cache
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          echo "--- mount type for /cache ---"
          mount | grep ' /cache '
          echo "--- df for /cache ---"
          df -h /cache
          sleep 3600
      volumeMounts:
        - name: cache
          mountPath: /cache
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          # The memory limit must comfortably exceed the tmpfs sizeLimit,
          # otherwise filling the volume trips the container's cgroup first.
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: ["ALL"]
