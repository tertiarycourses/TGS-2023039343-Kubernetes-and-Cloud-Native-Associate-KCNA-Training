# Lab 17 / Step 5 — emptyDir as the shared scratch space between two
# containers in the SAME Pod.
#
#   report-builder  writes  /shared/index.html   (from the seed dataset)
#   report-web      reads   /shared              (serves it over HTTP :8080)
#
# The two containers see the same inode tree because they mount the same
# emptyDir volume. The volume is created when the Pod is assigned to a node
# and destroyed when the Pod is removed from that node.
apiVersion: v1
kind: Pod
metadata:
  name: lane-report
  namespace: kcna-lab17
  labels:
    app.kubernetes.io/name: lane-report
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "17"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10017
    runAsGroup: 10017
    fsGroup: 10017
    seccompProfile:
      type: RuntimeDefault
  volumes:
    # The shared scratch space. No medium => node-backed (disk).
    - name: report
      emptyDir:
        sizeLimit: 64Mi
    # The seed dataset, projected read-only from a ConfigMap the learner
    # creates from data/shipments.csv.
    - name: seed
      configMap:
        name: tracklane-seed
        defaultMode: 0444
  containers:
    - name: report-builder
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          rows=$(( $(wc -l < /seed/shipments.csv) - 1 ))
          transit=$(grep -c ',in_transit$' /seed/shipments.csv || true)
          held=$(grep -c ',held_customs$' /seed/shipments.csv || true)
          {
            echo "<h1>TrackLane depot report</h1>"
            echo "<p>built: $(date -u +%Y-%m-%dT%H:%M:%SZ)</p>"
            echo "<p>pod: ${HOSTNAME}</p>"
            echo "<p>rows: ${rows}</p>"
            echo "<p>in_transit: ${transit}</p>"
            echo "<p>held_customs: ${held}</p>"
          } > /shared/index.html
          echo "report written to /shared/index.html (${rows} source rows)"
          # Refresh every 30s so the learner can watch the shared volume change.
          while true; do
            date -u +%Y-%m-%dT%H:%M:%SZ > /shared/heartbeat.txt
            sleep 30
          done
      volumeMounts:
        - name: report
          mountPath: /shared
        - name: seed
          mountPath: /seed
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: ["ALL"]
    - name: report-web
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          # Wait for the sibling container to publish the report.
          while [ ! -s /shared/index.html ]; do sleep 1; done
          echo "serving /shared on :8080"
          exec httpd -f -p 8080 -h /shared
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: report
          mountPath: /shared
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: ["ALL"]
