# Lab 23 · Part 3 — a deliberate Warning-event generator.
#
# This Pod mounts a ConfigMap named `depot-gate-config` that does not exist.
# The kubelet cannot start the container and re-raises a Warning event with
# reason FailedMount roughly every two minutes for as long as the Pod exists.
#
# It is here to give you a steady, predictable stream of Warning events to
# filter with --field-selector. It is NOT a puzzle to solve — the cause is
# stated in this comment. Lab 25 is where you diagnose faults blind.
apiVersion: v1
kind: Pod
metadata:
  name: depot-gate-agent
  namespace: kcna-lab23
  labels:
    app: depot-gate-agent
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/intentionally-broken: "true"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  volumes:
    - name: gate-config
      configMap:
        # This ConfigMap is intentionally absent.
        name: depot-gate-config
  containers:
    - name: agent
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: gate-config
          mountPath: /etc/gate
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
