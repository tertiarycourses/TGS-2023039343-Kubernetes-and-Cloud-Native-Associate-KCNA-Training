# Lab 23 · Part 5 — a predictable CPU consumer, so `kubectl top pods` has
# something other than idle noise to report.
#
# The container runs a tight arithmetic loop. Its CPU *limit* is 100m, so the
# kernel CFS quota throttles it at roughly one tenth of a core. When
# metrics-server is installed you should therefore see this Pod reported at or
# just below 100m. The exact number varies with your host — do not expect an
# identical figure to anyone else's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-indexer
  namespace: kcna-lab23
  labels:
    app: manifest-indexer
    app.kubernetes.io/part-of: depot-portal
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: manifest-indexer
  template:
    metadata:
      labels:
        app: manifest-indexer
        app.kubernetes.io/part-of: depot-portal
        tier: backend
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: indexer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "[indexer] rebuilding shipment index continuously"
              i=0
              while true; do
                i=$((i + 1))
                if [ $((i % 200000)) -eq 0 ]; then
                  echo "[indexer] $(date -u +%H:%M:%S) indexed batch $i"
                fi
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Hard ceiling: CFS quota throttles the loop at ~0.1 core.
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
