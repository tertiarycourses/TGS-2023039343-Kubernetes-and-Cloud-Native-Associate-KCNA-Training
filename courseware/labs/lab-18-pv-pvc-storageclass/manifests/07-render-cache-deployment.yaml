# Lab 18 / Step 10 — the first consumer. Scheduling this Pod is what unblocks
# the WaitForFirstConsumer binding on PVC render-cache.
#
# strategy: Recreate — a ReadWriteOnce volume can only be attached to one
# node at a time, and the local-path driver will not let two Pods mount the
# same directory during a rolling update. Recreate is the correct strategy
# for any single-writer, RWO-backed workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-cache
  namespace: kcna-lab18
  labels:
    app.kubernetes.io/name: render-cache
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "18"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: render-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: render-cache
        app.kubernetes.io/part-of: tracklane
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: render-cache
        - name: policy
          configMap:
            name: tracklane-retention-policy
            defaultMode: 0444
      containers:
        - name: cache
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Prove the volume is a real, writable, persistent filesystem
              # by appending one line per container start.
              echo "start ${HOSTNAME} $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                >> /cache/starts.log
              echo "--- /cache/starts.log ---"
              cat /cache/starts.log
              echo "--- bronze-tier datasets from the retention policy ---"
              grep ',bronze,' /policy/retention-policy.csv | cut -d, -f1
              sleep 3600
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: policy
              mountPath: /policy
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
