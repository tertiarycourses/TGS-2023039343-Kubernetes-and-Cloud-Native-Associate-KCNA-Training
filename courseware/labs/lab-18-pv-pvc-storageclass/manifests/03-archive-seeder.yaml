# Lab 18 / Step 5 — write the customs archive INTO the PersistentVolume.
#
# This Pod runs once and exits. Its only job is to copy the seed dataset from
# a ConfigMap into the bound PV, then record a provenance marker. We delete it
# afterwards and read the data back from a DIFFERENT Pod, which is the actual
# proof that the storage outlived the writer.
apiVersion: v1
kind: Pod
metadata:
  name: archive-seeder
  namespace: kcna-lab18
  labels:
    app.kubernetes.io/name: archive-seeder
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "18"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: archive
      persistentVolumeClaim:
        claimName: archive-claim
    - name: seed
      configMap:
        name: tracklane-archive-seed
        defaultMode: 0444
  containers:
    - name: seeder
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          cp /seed/manifest-archive.csv /archive/manifest-archive.csv
          rows=$(( $(wc -l < /archive/manifest-archive.csv) - 1 ))
          {
            echo "sealed_by=${HOSTNAME}"
            echo "sealed_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "archive_rows=${rows}"
            echo "retention_class=gold"
          } > /archive/PROVENANCE
          echo "wrote ${rows} archive rows to the PersistentVolume"
          cat /archive/PROVENANCE
      volumeMounts:
        - name: archive
          mountPath: /archive
        - name: seed
          mountPath: /seed
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: ["ALL"]
