{{/*
Lab 21 — Service.

Note the asymmetry with the Deployment: metadata.labels uses the FULL label
set, while spec.selector uses ONLY the selector labels. A Service that
selected on `helm.sh/chart` would stop matching its own Pods the moment you
bumped the chart version.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tracklane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracklane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tracklane.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
