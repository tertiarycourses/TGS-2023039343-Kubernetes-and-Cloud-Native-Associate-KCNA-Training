# Lab 21 / prod overlay — strategic-merge patch.
#
# Production gets a larger CPU/memory floor and a ceiling that permits burst.
# Same shape as the dev patch, different numbers — which is precisely the
# review artefact you want.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracklane
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
