# The Depot Portal booking service, configured entirely from outside the image.
#
# Requires two ConfigMaps created in Steps 3 and 4 from data/:
#   route-defaults   <- data/route-defaults.env   (kubectl create cm --from-env-file)
#   tariff-rates     <- data/tariff-rates.json    (kubectl create cm --from-file)
apiVersion: v1
kind: Pod
metadata:
  name: booking-config
  namespace: kcna-lab03
  labels:
    app.kubernetes.io/name: booking
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/lab: lab-03
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 3000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== 1. envFrom: every key of ConfigMap route-defaults ==="
          echo "DEPOT_REGION=${DEPOT_REGION}"
          echo "DEPOT_CODE=${DEPOT_CODE}"
          echo "BOOKING_WINDOW_MINUTES=${BOOKING_WINDOW_MINUTES}"
          echo "CURRENCY=${CURRENCY}"
          echo "LOG_LEVEL=${LOG_LEVEL}"
          echo "=== 2. envFrom with prefix: MF_ ==="
          echo "MF_DEPOT_CODE=${MF_DEPOT_CODE}"
          echo "=== 3. explicit env, incl. downward API ==="
          echo "SERVICE_NAME=${SERVICE_NAME}"
          echo "POD_NAME=${POD_NAME}"
          echo "NODE_NAME=${NODE_NAME}"
          echo "MEM_LIMIT_MI=${MEM_LIMIT_MI}"
          echo "=== 4. dependent env var expanded by the kubelet ==="
          echo "BOOKING_ENDPOINT=${BOOKING_ENDPOINT}"
          echo "=== 5. dataset mounted from ConfigMap tariff-rates ==="
          echo "TARIFF_TABLE=${TARIFF_TABLE}"
          echo "tariff entries: `grep -c depot_code ${TARIFF_TABLE}`"
          echo "rate row for ${DEPOT_CODE}:"
          grep "${DEPOT_CODE}" "${TARIFF_TABLE}"
          echo "=== booking-config ready ==="
          sleep 3600
      envFrom:
        # Every key of the ConfigMap becomes an environment variable.
        - configMapRef:
            name: route-defaults
        # The same keys again, this time namespaced with a prefix.
        - prefix: MF_
          configMapRef:
            name: route-defaults
        # A per-environment override map that does not exist in this lab.
        # optional: true means "do not block startup if it is missing".
        - configMapRef:
            name: route-overrides
            optional: true
      env:
        - name: SERVICE_NAME
          value: booking
        - name: TARIFF_TABLE
          value: /etc/depot/tariff-rates.json
        # Dependent variable: $(VAR) is expanded from EARLIER entries of THIS
        # env list by the kubelet, before the container starts.
        - name: BOOKING_ENDPOINT
          value: http://$(SERVICE_NAME).kcna-lab03.svc.cluster.local:8080
        # Downward API — pod facts injected as env.
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MEM_LIMIT_MI
          valueFrom:
            resourceFieldRef:
              containerName: app
              resource: limits.memory
              divisor: 1Mi
        # A single key out of a ConfigMap, renamed on the way in.
        - name: TRAILERS_PER_BAY
          valueFrom:
            configMapKeyRef:
              name: route-defaults
              key: MAX_TRAILERS_PER_BAY
      volumeMounts:
        - name: tariffs
          mountPath: /etc/depot
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: tariffs
      configMap:
        name: tariff-rates
        defaultMode: 0444
