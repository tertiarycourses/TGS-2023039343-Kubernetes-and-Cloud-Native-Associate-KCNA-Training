# Namespaced policy objects. They exist here so that the reconnaissance steps
# have something interesting to discover with `kubectl get`, `kubectl explain`
# and `kubectl get -o yaml`.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: depot-recon-quota
  namespace: kcna-lab01
  labels:
    app.kubernetes.io/part-of: depot-portal
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    count/configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: depot-recon-defaults
  namespace: kcna-lab01
  labels:
    app.kubernetes.io/part-of: depot-portal
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 500m
        memory: 256Mi
