# HorizontalPodAutoscaler, autoscaling/v2 (the current stable version;
# autoscaling/v1 only supports a single CPU target and no behaviour block).
#
# IMPORTANT ON A STOCK kind CLUSTER: metrics-server is NOT installed, so the
# HPA has no metrics source and will report TARGETS as <unknown>/60% with the
# condition ScalingActive=False, reason=FailedGetResourceMetric. That is the
# expected, correct behaviour - see section 5 of the README. Nothing here is
# misconfigured; the metrics pipeline is simply absent.
#
# The desired replica formula the controller would apply:
#   desired = ceil( current * ( currentMetric / targetMetric ) )
# bounded by minReplicas/maxReplicas and damped by the behaviour block below.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quote-engine
  namespace: kcna-lab10
  labels:
    app: quote-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quote-engine
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 200Mi
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
