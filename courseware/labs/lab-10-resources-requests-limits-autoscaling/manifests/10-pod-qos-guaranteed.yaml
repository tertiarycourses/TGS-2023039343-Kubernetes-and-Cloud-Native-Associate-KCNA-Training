# QoS class: Guaranteed
# Requirement: EVERY container in the Pod sets both cpu and memory, and for
# each resource requests == limits exactly. Values taken from
# data/workload-profiles.csv row "berth-ledger".
# Guaranteed Pods are the last to be evicted when a node runs out of memory.
apiVersion: v1
kind: Pod
metadata:
  name: berth-ledger
  namespace: kcna-lab10
  labels:
    app: berth-ledger
    tier: data
    qos-demo: guaranteed
spec:
  containers:
    - name: ledger
      image: nginx:1.27-alpine
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - SETGID
            - SETUID
            - NET_BIND_SERVICE
  terminationGracePeriodSeconds: 5
