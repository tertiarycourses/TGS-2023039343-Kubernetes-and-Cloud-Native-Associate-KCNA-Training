# QoS class: Burstable
# Requirement: at least one container sets a request or a limit, but the Pod
# does not meet the Guaranteed rule. Here requests < limits, so the container
# is scheduled against 50m/64Mi but may burst to 200m/192Mi when the node has
# spare capacity. Values from data/workload-profiles.csv row "rate-quoter".
apiVersion: v1
kind: Pod
metadata:
  name: rate-quoter
  namespace: kcna-lab10
  labels:
    app: rate-quoter
    tier: edge
    qos-demo: burstable
spec:
  containers:
    - name: quoter
      image: nginx:1.27-alpine
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - SETGID
            - SETUID
            - NET_BIND_SERVICE
  terminationGracePeriodSeconds: 5
