# Lab 20 / Step 11 — read the DR runbook and the backup policy from inside the
# cluster they describe.
#
# This Pod mounts two ConfigMaps read-only and prints selected sections. It has
# NO ServiceAccount token, NO host mounts, NO capabilities and a read-only root
# filesystem. It cannot reach etcd, cannot reach the node and cannot execute
# anything from the runbook.
#
# That is deliberate: the runbook's destructive section must be readable
# without being runnable.
apiVersion: v1
kind: Pod
metadata:
  name: runbook-reader
  namespace: kcna-lab20
  labels:
    app.kubernetes.io/name: runbook-reader
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "20"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  # No API access at all. This Pod does not need to talk to Kubernetes.
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10020
    runAsGroup: 10020
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: runbook
      configMap:
        name: etcd-restore-runbook
        defaultMode: 0444
    - name: policy
      configMap:
        name: etcd-backup-policy
        defaultMode: 0444
  containers:
    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          echo "=== SAFETY BANNER FROM THE RUNBOOK ==============================="
          grep -n 'DO NOT RUN' /runbook/etcd-restore-runbook.md
          echo
          echo "=== RECOVERY OBJECTIVES FROM THE BACKUP POLICY =================="
          grep -E 'rpo_minutes|rto_minutes|interval:|offsite_required' \
            /policy/policy.yaml
          echo
          echo "=== WHAT AN etcd RESTORE DOES *NOT* RECOVER ====================="
          sed -n '/### What restore does NOT recover/,/## 4\./p' \
            /runbook/etcd-restore-runbook.md | head -20
          echo
          echo "=== SECTION COUNT ==============================================="
          echo "runbook_headings=$(grep -c '^## ' /runbook/etcd-restore-runbook.md)"
          echo "do_not_run_banners=$(grep -c 'DO NOT RUN' /runbook/etcd-restore-runbook.md)"
          sleep 3600
      volumeMounts:
        - name: runbook
          mountPath: /runbook
          readOnly: true
        - name: policy
          mountPath: /policy
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
