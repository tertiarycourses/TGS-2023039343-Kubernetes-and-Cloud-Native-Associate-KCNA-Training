# Lab 20 / Step 7 — turn the platform team's control-plane inventory into the
# exact object names to inspect on THIS cluster.
#
# The inventory in data/control-plane-inventory.csv is written generically
# (kube-apiserver, etcd, ...). Static Pods are mirrored into the API server as
# `<component>-<nodeName>`, so the Job reads its own node name from the
# downward API and prints the concrete names you must look up.
#
# The Job is read-only: it prints a report and exits. It touches nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: cp-inventory
  namespace: kcna-lab20
  labels:
    app.kubernetes.io/name: cp-inventory
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "20"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cp-inventory
        app.kubernetes.io/part-of: tracklane
    spec:
      restartPolicy: Never
      serviceAccountName: cp-inventory
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10020
        runAsGroup: 10020
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: inventory
          configMap:
            name: control-plane-inventory
            defaultMode: 0444
      containers:
        - name: report
          image: busybox:1.36
          env:
            # The downward API is how a Pod learns facts about itself and its
            # placement without any API permission at all.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "TrackLane control-plane inventory for node ${NODE_NAME}"
              echo "generated from data/control-plane-inventory.csv"
              echo "================================================================"
              printf '%-26s %-12s %s\n' COMPONENT DEPLOYMENT "OBJECT OR PATH TO INSPECT"
              STATIC=0
              TOTAL=0
              # Skip the header row, then split on commas.
              tail -n +2 /inventory/control-plane-inventory.csv | while IFS=, read -r \
                  comp kind path ports owner blast summary; do
                TOTAL=$((TOTAL + 1))
                case "$kind" in
                  StaticPod)
                    # Mirror-pod naming rule: <component>-<nodeName>
                    printf '%-26s %-12s kube-system/pod/%s-%s\n' \
                      "$comp" "$kind" "$comp" "${NODE_NAME}"
                    ;;
                  *)
                    printf '%-26s %-12s %s\n' "$comp" "$kind" "$path"
                    ;;
                esac
              done
              echo "================================================================"
              STATIC=$(tail -n +2 /inventory/control-plane-inventory.csv \
                | grep -c ',StaticPod,')
              TOTAL=$(tail -n +2 /inventory/control-plane-inventory.csv | grep -c '')
              echo "inventory_rows=${TOTAL}"
              echo "static_pod_components=${STATIC}"
              echo "namespace=${POD_NAMESPACE}"
              echo "NOTE: this Job has namespaced RBAC only and cannot read kube-system."
          volumeMounts:
            - name: inventory
              mountPath: /inventory
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
