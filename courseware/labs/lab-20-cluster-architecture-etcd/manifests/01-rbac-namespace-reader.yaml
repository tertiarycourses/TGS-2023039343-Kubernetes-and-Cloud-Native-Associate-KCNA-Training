# Lab 20 / Step 7 — least privilege for the inventory Job.
#
# Deliberately a Role and RoleBinding (namespaced), NOT a ClusterRole. The
# inventory Job has no business reading kube-system, and this lab does not
# grant itself cluster-wide read just because it is "about the control plane".
#
# The contrast is the teaching point: YOUR kubectl context is a cluster admin
# and can read kube-system directly (Steps 2-6). The workload you deploy is
# scoped to one namespace and cannot. Real platform tooling should look like
# the workload, not like your laptop.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cp-inventory
  namespace: kcna-lab20
  labels:
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "20"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cp-inventory-reader
  namespace: kcna-lab20
  labels:
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "20"
rules:
  # Read-only, this namespace only, no secrets, no write verbs.
  - apiGroups: [""]
    resources: ["pods", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cp-inventory-reader
  namespace: kcna-lab20
  labels:
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "20"
subjects:
  - kind: ServiceAccount
    name: cp-inventory
    namespace: kcna-lab20
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cp-inventory-reader
