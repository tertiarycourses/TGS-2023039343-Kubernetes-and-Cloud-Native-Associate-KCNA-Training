# INJECTION STYLE 2 of 2 — volumes.
#
# Trade-offs:
#   + a whole-directory mount is UPDATED in place when the ConfigMap changes
#     (kubelet refreshes it within roughly one sync period, ~1 minute)
#   + values never enter the process environment, so they do not leak through
#     /proc/<pid>/environ, crash dumps or child processes
#   - the application must read files, and must re-read them to see updates
#   - a subPath mount is a POINT-IN-TIME COPY and is NEVER updated - the
#     single most common ConfigMap surprise. Both forms are mounted below so
#     you can prove it in README Step 8.
apiVersion: v1
kind: Pod
metadata:
  name: volume-consumer
  namespace: kcna-lab15
  labels:
    app: booking-api
    injection: volume
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # fsGroup makes kubelet set GROUP ownership of the projected volumes to
    # 1000. Without it a 0440 Secret file would be root:root and the
    # non-root container could NOT read it - a classic permission-denied
    # surprise when hardening a workload.
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        # (a) WHOLE-DIRECTORY mount. Live-updating.
        - name: app-config
          mountPath: /etc/booking/config
          readOnly: true
        # (b) subPath mount of a single key into an existing directory.
        #     Point-in-time copy: it will NOT track ConfigMap changes.
        - name: app-config
          mountPath: /etc/booking/pinned-settings.json
          subPath: app-settings.json
          readOnly: true
        # (c) Secret as a volume, mode 0440, group = fsGroup 1000.
        - name: credentials
          mountPath: /etc/booking/credentials
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: app-config
      configMap:
        name: booking-app-config
        # items: project only the keys you need, and rename them.
        # Without items, EVERY key in the ConfigMap becomes a file.
        items:
          - key: app-settings.json
            path: app-settings.json
          - key: APP_GREETING
            path: greeting.txt
    - name: credentials
      secret:
        secretName: booking-credentials
        # 0440: read-only for owner and group; no access for anyone else.
        # Secret volumes are tmpfs-backed, so they are never written to the
        # node's disk.
        defaultMode: 0440
  restartPolicy: Never
