# TEACHING EXAMPLE ONLY — shows the SHAPE of a declarative Secret.
#
# ############################################################################
# #  NEVER COMMIT A REAL SECRET TO A REPOSITORY.                             #
# #  Every value here is a self-describing placeholder and authenticates to   #
# #  nothing. The Secret the Pods actually consume (booking-credentials) is   #
# #  created imperatively from data/dummy-credentials.env in README Step 5,   #
# #  precisely so that no Secret manifest is checked in.                      #
# ############################################################################
#
# stringData vs data:
#   stringData - you write PLAINTEXT; the API server base64-encodes it on write
#                and it does not appear when you read the object back.
#   data       - you write base64 yourself.
# Neither is encryption. See README Step 6.
apiVersion: v1
kind: Secret
metadata:
  name: booking-api-example
  namespace: kcna-lab15
  labels:
    app: booking-api
# Opaque is the default type: arbitrary key/value. Other built-in types
# (kubernetes.io/tls, kubernetes.io/dockerconfigjson, kubernetes.io/basic-auth)
# require specific keys and are validated by the API server.
type: Opaque
stringData:
  EXAMPLE_USERNAME: "DUMMY-not-a-real-username"
  EXAMPLE_PASSWORD: "DUMMY-not-a-real-password-change-me"
