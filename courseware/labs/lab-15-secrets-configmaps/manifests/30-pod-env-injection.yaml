# INJECTION STYLE 1 of 2 — environment variables.
#
# Trade-offs, which are examinable:
#   + simple, works with any language, no file parsing
#   - values are FROZEN at container start; changing the ConfigMap does NOT
#     update a running container
#   - the whole environment is visible to anything that can read /proc/<pid>/environ
#     inside the container, and to `kubectl describe pod` for configMapKeyRef
#     (Secret VALUES are masked in describe, but the KEY NAMES are not)
#   - a missing key is a HARD FAILURE: CreateContainerConfigError
apiVersion: v1
kind: Pod
metadata:
  name: env-consumer
  namespace: kcna-lab15
  labels:
    app: booking-api
    injection: env
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        # One named key from a ConfigMap, renamed on the way in.
        - name: GREETING
          valueFrom:
            configMapKeyRef:
              name: booking-app-config
              key: APP_GREETING
        - name: MULTILEG_ENABLED
          valueFrom:
            configMapKeyRef:
              name: booking-app-config
              key: FEATURE_MULTILEG_QUOTES
        # One named key from a Secret.
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: booking-credentials
              key: BOOKING_DB_USERNAME
        # An OPTIONAL key: the container starts even if it is absent.
        - name: OPTIONAL_TUNING
          valueFrom:
            configMapKeyRef:
              name: booking-app-config
              key: NOT_PRESENT_ON_PURPOSE
              optional: true
      envFrom:
        # Bulk import: EVERY key becomes an environment variable of the same
        # name, with `prefix` prepended so bulk imports cannot collide.
        # Keys that are not valid shell identifiers (here: "app-settings.json",
        # because of the dot and hyphen) are SKIPPED. kubelet records a
        # WARNING event named InvalidEnvironmentVariableNames; the container
        # still starts.
        - prefix: CFG_
          configMapRef:
            name: booking-app-config
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  restartPolicy: Never
