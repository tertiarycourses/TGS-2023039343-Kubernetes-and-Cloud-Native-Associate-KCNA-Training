# FAILURE INJECTION (README section 6). Apply this on purpose.
#
# APP_TIER does not exist in the booking-app-config ConfigMap. The key is not
# marked optional, so kubelet cannot build the container's environment and the
# Pod parks in CreateContainerConfigError - Pending, never Running, restarting
# on a back-off.
#
# This file is schema-valid: kubeconform accepts it. Nothing validates that a
# referenced KEY exists, at any layer, until kubelet tries to start the
# container.
apiVersion: v1
kind: Pod
metadata:
  name: broken-key-consumer
  namespace: kcna-lab15
  labels:
    app: booking-api
    kcna.tertiaryinfotech.com/intent: failure-injection
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - name: APP_TIER
          valueFrom:
            configMapKeyRef:
              name: booking-app-config
              key: APP_TIER
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  restartPolicy: Never
