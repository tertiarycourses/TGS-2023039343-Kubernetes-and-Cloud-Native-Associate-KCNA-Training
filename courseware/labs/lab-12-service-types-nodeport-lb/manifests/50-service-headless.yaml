# TYPE 4 of 4 — Headless.
# Not a distinct `type`; it is type ClusterIP with clusterIP explicitly set to
# the literal string "None". No virtual IP is allocated and kube-proxy installs
# no rules. DNS answers with one A record per READY endpoint, so the client
# does its own selection. This is the shape StatefulSets use (Lab 19).
apiVersion: v1
kind: Service
metadata:
  name: booking-edge-headless
  namespace: kcna-lab12
  labels:
    app: booking-edge
    kcna.tertiaryinfotech.com/service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: booking-edge
  ports:
    - name: http
      port: 80
      targetPort: 5678
      protocol: TCP
