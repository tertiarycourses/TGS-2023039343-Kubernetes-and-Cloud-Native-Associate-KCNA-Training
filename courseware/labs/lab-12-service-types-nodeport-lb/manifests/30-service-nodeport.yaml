# TYPE 2 of 4 — NodePort.
# Superset of ClusterIP: it still gets a ClusterIP, and additionally opens the
# same port on EVERY node. nodePort must fall inside the API server's
# --service-node-port-range, which defaults to 30000-32767.
# Omit nodePort to let the API server allocate one for you; it is pinned here so
# the lab and verification/checks.sh can refer to a known number.
apiVersion: v1
kind: Service
metadata:
  name: booking-edge-nodeport
  namespace: kcna-lab12
  labels:
    app: booking-edge
    kcna.tertiaryinfotech.com/service-type: nodeport
spec:
  type: NodePort
  selector:
    app: booking-edge
  ports:
    - name: http
      port: 80
      targetPort: 5678
      nodePort: 30080
      protocol: TCP
