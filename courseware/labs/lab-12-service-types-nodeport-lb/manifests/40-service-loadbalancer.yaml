# TYPE 3 of 4 — LoadBalancer.
# Superset of NodePort: ClusterIP + nodePort + a REQUEST to an external
# load-balancer provider.
#
# ON A kind CLUSTER THIS SERVICE WILL SIT AT EXTERNAL-IP <pending> FOREVER.
# That is the correct, expected result, not a bug. Nothing in the cluster
# implements the request: a cloud-controller-manager (EKS/GKE/AKS) or an
# on-prem implementation such as MetalLB or cloud-provider-kind has to watch
# for type=LoadBalancer Services and write .status.loadBalancer.ingress.
# kind ships none of these. See README section 4, Step 5.
apiVersion: v1
kind: Service
metadata:
  name: booking-edge-lb
  namespace: kcna-lab12
  labels:
    app: booking-edge
    kcna.tertiaryinfotech.com/service-type: loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: booking-edge
  ports:
    - name: http
      port: 80
      targetPort: 5678
      protocol: TCP
