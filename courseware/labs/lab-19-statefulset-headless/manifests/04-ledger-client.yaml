# Lab 19 / Step 5 — an in-cluster client.
#
# DNS experiments MUST be run from inside the cluster: your laptop's resolver
# knows nothing about cluster.local. This Pod exists purely to give you a
# shell with the cluster DNS config and busybox's nslookup and wget.
apiVersion: v1
kind: Pod
metadata:
  name: ledger-client
  namespace: kcna-lab19
  labels:
    app.kubernetes.io/name: ledger-client
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "19"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10019
    runAsGroup: 10019
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
