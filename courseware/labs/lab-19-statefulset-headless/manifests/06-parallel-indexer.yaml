# Lab 19 / Step 9 — podManagementPolicy: Parallel.
#
# The depot ledger uses OrderedReady because a ledger must bootstrap in a
# known order. The lane indexer has no such requirement: its three members are
# independent shards that only need stable names, so it starts and stops them
# all at once and comes up roughly three times faster.
#
# Deliberately NO volumeClaimTemplates here. It proves a point learners often
# miss: a StatefulSet is about stable IDENTITY (names, ordinals, DNS, ordering).
# Per-Pod storage is a common companion, not a requirement.
---
apiVersion: v1
kind: Service
metadata:
  name: lane-indexer
  namespace: kcna-lab19
  labels:
    app.kubernetes.io/name: lane-indexer
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "19"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lane-indexer
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lane-indexer
  namespace: kcna-lab19
  labels:
    app.kubernetes.io/name: lane-indexer
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "19"
spec:
  serviceName: lane-indexer
  replicas: 3
  # Parallel: launch and terminate all Pods simultaneously. Ordinals and DNS
  # names are still stable — only the SEQUENCING guarantee is given up.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: lane-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lane-indexer
        app.kubernetes.io/part-of: tracklane
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10019
        runAsGroup: 10019
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /tmp/www
              printf 'lane-indexer ordinal %s ready\n' "${HOSTNAME##*-}" \
                > /tmp/www/index.html
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
