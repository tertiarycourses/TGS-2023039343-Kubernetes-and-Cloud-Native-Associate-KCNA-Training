# Lab 19 / Step 6 — an ORDINARY ClusterIP Service over the same Pods, so you
# can compare the two DNS behaviours side by side.
#
# Identical selector, identical backends. The only difference is that this one
# has a virtual IP, so:
#   * depot-ledger-vip.kcna-lab19.svc.cluster.local  -> ONE address (the VIP)
#   * depot-ledger.kcna-lab19.svc.cluster.local      -> THREE addresses (the Pods)
#
# Use the VIP when any replica will do. Use the headless name when the client
# must choose a specific replica — which is the whole reason stateful systems
# (Kafka, Cassandra, etcd, PostgreSQL replicas) need headless Services.
apiVersion: v1
kind: Service
metadata:
  name: depot-ledger-vip
  namespace: kcna-lab19
  labels:
    app.kubernetes.io/name: depot-ledger
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "19"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: depot-ledger
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
