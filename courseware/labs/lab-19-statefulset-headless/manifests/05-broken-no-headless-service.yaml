# Lab 19 / FAILURE INJECTION — deliberately broken. DO NOT "fix" this file.
#
# `serviceName: ghost-ledger` names a headless Service that DOES NOT EXIST.
#
# Nothing rejects this. The API server accepts it, the controller creates the
# Pod, the Pod becomes Ready, and `kubectl get statefulset` shows 1/1. The only
# symptom is that the promised stable DNS name never resolves — which you
# discover in production, at 03:00, when a peer cannot find its cluster.
#
# Note the second, quieter consequence: with no Service selecting these Pods,
# there is no EndpointSlice for them either. That is the diagnostic to reach
# for after the NXDOMAIN.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghost-ledger
  namespace: kcna-lab19
  labels:
    app.kubernetes.io/name: ghost-ledger
    app.kubernetes.io/part-of: tracklane
    kcna.tertiaryinfotech.com/lab: "19"
    kcna.tertiaryinfotech.com/intent: failure-injection
spec:
  serviceName: ghost-ledger
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghost-ledger
        app.kubernetes.io/part-of: tracklane
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
