# Lab 22 · Part 6 — FAILURE INJECTION.
#
# This is the classic real-world outage: an engineer removed the startupProbe
# (or never added one) and tuned liveness "tight" so failures are caught fast.
# The application is perfectly healthy — it is just SLOW to boot.
#
#   liveness budget = initialDelaySeconds 5 + (periodSeconds 5 x
#                     failureThreshold 2) = ~15s before the kubelet kills it
#   real start time = ~40s
#
# The container can therefore NEVER finish starting. The kubelet kills it at
# ~15s, restarts it, and the cycle repeats forever: RESTARTS climbs and the
# Pod settles into CrashLoopBackOff. Nothing is wrong with the application.
#
# Apply this deliberately, diagnose it, then delete THIS Deployment only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-indexer-outage
  namespace: kcna-lab22
  labels:
    app: manifest-indexer-outage
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/intentionally-broken: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: manifest-indexer-outage
  template:
    metadata:
      labels:
        app: manifest-indexer-outage
        app.kubernetes.io/part-of: depot-portal
    spec:
      terminationGracePeriodSeconds: 5
      volumes:
        - name: webroot
          emptyDir: {}
      containers:
        - name: indexer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "[indexer] $(date -u +%H:%M:%S) warming shipment manifest index..."
              sleep 40
              echo "manifest-indexer ready" > /www/index.html
              echo "[indexer] $(date -u +%H:%M:%S) index warm; serving on :8080"
              exec httpd -f -v -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: webroot
              mountPath: /www
          # NO startupProbe. THIS is the bug.
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
