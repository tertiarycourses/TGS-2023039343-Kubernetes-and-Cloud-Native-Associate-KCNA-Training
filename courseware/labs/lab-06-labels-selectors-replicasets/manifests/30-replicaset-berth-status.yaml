# ReplicaSet using the set-based selector form: matchExpressions.
# Three operators are exercised at once:
#   In        -> app must be one of the listed values
#   NotIn     -> tier must NOT be experimental
#   Exists    -> the key release must be present (any value)
# matchLabels and matchExpressions are ANDed when both are supplied.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: berth-status
  namespace: kcna-lab06
  labels:
    app: berth-status
    tier: internal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: berth-status
    matchExpressions:
      - key: tier
        operator: NotIn
        values:
          - experimental
      - key: release
        operator: Exists
      - key: app
        operator: In
        values:
          - berth-status
  template:
    metadata:
      labels:
        app: berth-status
        tier: internal
        env: staging
        release: r24
        provenance: replicaset
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
      terminationGracePeriodSeconds: 5
