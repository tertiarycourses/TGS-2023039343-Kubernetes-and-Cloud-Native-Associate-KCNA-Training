# Reads data/service-inventory.csv (delivered as the ConfigMap
# service-inventory, created in Step 2) and prints the label set the platform
# team has standardised on. This is the authoritative source for the label
# values applied elsewhere in the lab.
apiVersion: v1
kind: Pod
metadata:
  name: label-audit
  namespace: kcna-lab06
  labels:
    app: label-audit
    tier: tooling
    env: staging
    release: r24
spec:
  restartPolicy: Never
  containers:
    - name: audit
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "== MFS service inventory: tier=edge services =="
          awk -F, 'NR>1 && $3=="edge" {print $1" app="$2" tier="$3" env="$4" release="$5}' \
            /data/service-inventory.csv
          echo "== counts by tier =="
          awk -F, 'NR>1 {c[$3]++} END {for (t in c) print t"="c[t]}' \
            /data/service-inventory.csv | sort
          echo "AUDIT-COMPLETE"
      volumeMounts:
        - name: inventory
          mountPath: /data
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  volumes:
    - name: inventory
      configMap:
        name: service-inventory
