# ReplicaSet using the simple equality-based selector form: matchLabels.
# Every key/value in matchLabels must be present on a Pod for it to be owned.
# The template labels MUST be a superset of the selector, or the API server
# rejects the object with "`selector` does not match template `labels`".
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: tracking-api
  namespace: kcna-lab06
  labels:
    app: tracking-api
    tier: edge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tracking-api
      tier: edge
  template:
    metadata:
      labels:
        app: tracking-api
        tier: edge
        env: staging
        release: r24
        provenance: replicaset
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
      terminationGracePeriodSeconds: 5
