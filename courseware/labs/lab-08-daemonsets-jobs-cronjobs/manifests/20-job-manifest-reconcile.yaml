# Batch reconciliation of the overnight cargo-manifest queue.
#
# completionMode: Indexed gives every Pod a distinct index in
# JOB_COMPLETION_INDEX (0..completions-1). Each Pod uses its index to select
# exactly one line from data/manifest-queue.txt, so six Pods process six
# distinct work items with no coordination and no duplicate work.
#
#   completions: 6   -> six successful Pods are required before the Job is Complete
#   parallelism: 2   -> at most two Pods run at the same time
#   backoffLimit: 2  -> at most two retries in total before the Job is failed
apiVersion: batch/v1
kind: Job
metadata:
  name: manifest-reconcile
  namespace: kcna-lab08
  labels:
    app: manifest-reconcile
    tier: batch
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 2
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: manifest-reconcile
        tier: batch
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              IDX="${JOB_COMPLETION_INDEX}"
              LINE=$(sed -n "$((IDX + 1))p" /data/manifest-queue.txt)
              if [ -z "$LINE" ]; then
                echo "index=${IDX} no work item found - queue too short"
                exit 1
              fi
              echo "index=${IDX} reconciling ${LINE}"
              sleep 4
              echo "index=${IDX} RECONCILED ${LINE}"
          volumeMounts:
            - name: queue
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: queue
          configMap:
            name: berth-data
      terminationGracePeriodSeconds: 5
