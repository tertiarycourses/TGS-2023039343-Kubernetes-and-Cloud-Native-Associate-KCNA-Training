# Marina Freight Systems - berth telemetry agent.
# A DaemonSet is the "one Pod per node" controller: the DaemonSet controller
# creates exactly one Pod for every node that matches .spec.template.spec
# node constraints. On the single-node kind cluster used in this course that
# means DESIRED = CURRENT = 1. On the MFS production cluster (14 nodes) the
# identical manifest yields 14 Pods with no change to the YAML.
#
# The toleration below is defensive: kind removes the control-plane NoSchedule
# taint on a single-node cluster, but a real node agent must tolerate it so it
# still runs on control-plane nodes in a multi-node cluster. It grants NO extra
# privilege - a toleration only permits scheduling.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: berth-agent
  namespace: kcna-lab08
  labels:
    app: berth-agent
    tier: node-agent
spec:
  selector:
    matchLabels:
      app: berth-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: berth-agent
        tier: node-agent
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/sh
            - -c
            - |
              echo "berth-agent starting on node=${NODE_NAME}"
              while true; do
                TS=$(date -u +%H:%M:%S)
                awk -F, -v node="${NODE_NAME}" -v ts="${TS}" '
                  NR>1 {depth[$2]=$4; occ[$2]=$5}
                  END {
                    n=0; alert=0
                    for (b in depth) {
                      n++
                      if (occ[b]+0 >= 90) alert++
                    }
                    printf "%s node=%s berths=%d high_occupancy=%d\n", ts, node, n, alert
                  }' /data/berth-readings.csv
                sleep 20
              done
          volumeMounts:
            - name: readings
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: readings
          configMap:
            name: berth-data
      terminationGracePeriodSeconds: 5
