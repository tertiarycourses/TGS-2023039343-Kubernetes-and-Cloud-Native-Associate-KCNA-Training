# Yard report batch - carries NO toleration.
# Once the learner taints the node with
#   mfs.io/maintenance=window:NoSchedule
# this Pod can no longer be placed and goes Pending. Existing Pods are NOT
# evicted, because the effect is NoSchedule and not NoExecute.
apiVersion: v1
kind: Pod
metadata:
  name: yard-report
  namespace: kcna-lab09
  labels:
    app: yard-report
    tier: batch
    placement: no-toleration
spec:
  containers:
    - name: report
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  terminationGracePeriodSeconds: 3
