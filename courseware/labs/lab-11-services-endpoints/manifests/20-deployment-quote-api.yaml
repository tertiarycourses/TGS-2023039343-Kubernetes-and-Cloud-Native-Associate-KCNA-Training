apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  namespace: kcna-lab11
  labels:
    app: quote-api
    app.kubernetes.io/name: quote-api
    app.kubernetes.io/part-of: meridian-freight
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quote-api
  template:
    metadata:
      labels:
        app: quote-api
        app.kubernetes.io/name: quote-api
        app.kubernetes.io/part-of: meridian-freight
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            # The port is NAMED. The Service refers to the name, not the number,
            # so the container listener can move without editing the Service.
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: quote-api-content
        - name: nginx-conf
          configMap:
            name: quote-api-nginx
