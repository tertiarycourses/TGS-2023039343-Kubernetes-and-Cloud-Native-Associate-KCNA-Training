# The same image with automountServiceAccountToken: false.
# No API credential is projected at all, so a compromised process in this Pod
# has nothing to present to the API server. Set this on every workload that
# does not call the Kubernetes API - which is most of them.
apiVersion: v1
kind: Pod
metadata:
  name: no-token
  namespace: kcna-lab14
  labels:
    app: no-token
    role: diagnostics
spec:
  serviceAccountName: deploy-bot
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  restartPolicy: Never
