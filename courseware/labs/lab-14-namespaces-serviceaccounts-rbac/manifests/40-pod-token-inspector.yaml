# Runs as the ops-reader ServiceAccount. kubelet projects a short-lived,
# audience-bound token into the Pod at
#   /var/run/secrets/kubernetes.io/serviceaccount/
# alongside the cluster CA bundle and the namespace name.
#
# securityContext satisfies the Pod Security "restricted" profile, which the
# namespace warns on: non-root, all capabilities dropped, no privilege
# escalation, RuntimeDefault seccomp.
apiVersion: v1
kind: Pod
metadata:
  name: token-inspector
  namespace: kcna-lab14
  labels:
    app: token-inspector
    role: diagnostics
spec:
  serviceAccountName: ops-reader
  # Default is true. Made explicit here so the contrast with
  # 50-pod-no-token.yaml is visible in the manifest.
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "7200"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  restartPolicy: Never
