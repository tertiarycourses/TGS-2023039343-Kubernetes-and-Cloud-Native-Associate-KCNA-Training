# Two identities. Creating a ServiceAccount grants NOTHING - an unbound
# ServiceAccount is a name with no permissions at all. deploy-bot stays unbound
# on purpose so the matrix in data/rbac-matrix.csv can prove it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-reader
  namespace: kcna-lab14
  labels:
    app.kubernetes.io/part-of: meridian-freight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot
  namespace: kcna-lab14
  labels:
    app.kubernetes.io/part-of: meridian-freight
