# =========================================================================
# BROKEN MANIFEST 2 of 4 — ticket DEP-1042
#
# Deliberately SCHEMA-VALID. `kubectl apply` succeeds, the image pulls
# successfully, the container is created and started — and then dies.
#
# <details>
# BUG      : the command references /usr/local/bin/depot-shipment-worker,
#            a binary that does not exist in the busybox image. The shell
#            exits 127 ("command not found").
# PHASE    : container start (after a SUCCESSFUL image pull)
# SYMPTOM  : STATUS CrashLoopBackOff, RESTARTS climbing, exit code 127
# FIX      : run a command that exists in the image, or use an image that
#            actually contains the binary
# </details>
#
# WHY 127 MATTERS: exit code 127 is the shell's "command not found". It tells
# you the container image and the command disagree — a packaging problem, not
# an application bug. Compare with exit code 1 (the app ran and failed) and
# exit code 137 (SIGKILL, usually OOMKilled or a failed liveness probe).
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-worker
  namespace: kcna-lab25
  labels:
    app: shipment-worker
    app.kubernetes.io/part-of: depot-portal
    kcna.tertiaryinfotech.com/intentionally-broken: "true"
    kcna.tertiaryinfotech.com/ticket: DEP-1042
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: shipment-worker
  template:
    metadata:
      labels:
        app: shipment-worker
        app.kubernetes.io/part-of: depot-portal
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "[worker] starting shipment worker for depot sg-tuas"
              exec /usr/local/bin/depot-shipment-worker --config /etc/depot/worker.yaml
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
