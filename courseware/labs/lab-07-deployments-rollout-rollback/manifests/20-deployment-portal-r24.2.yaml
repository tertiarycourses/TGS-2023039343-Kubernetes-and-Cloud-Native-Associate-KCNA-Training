# Freight Portal release r24.2 (revision 2).
# Two things changed relative to revision 1:
#   1. the mounted ConfigMap  -> portal-site-r24-2  (visible content change)
#   2. the release Pod label   -> r24.2
# maxSurge/maxUnavailable are tightened to 1/0 per data/release-plan.csv: this
# release must never drop below 4 Available Pods, so the rollout surges first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freight-portal
  namespace: kcna-lab07
  labels:
    app: freight-portal
    tier: edge
  annotations:
    kubernetes.io/change-cause: "r24.2 - customs banner, zero-unavailable rollout"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  minReadySeconds: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: freight-portal
      tier: edge
  template:
    metadata:
      labels:
        app: freight-portal
        tier: edge
        release: r24.2
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
      volumes:
        - name: site
          configMap:
            name: portal-site-r24-2
      terminationGracePeriodSeconds: 5
