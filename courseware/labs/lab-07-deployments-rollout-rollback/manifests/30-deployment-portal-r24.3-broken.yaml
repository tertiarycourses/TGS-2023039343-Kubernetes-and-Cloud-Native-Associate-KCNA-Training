# DELIBERATELY BROKEN - Freight Portal release r24.3 (revision 3).
# The image tag does not exist in Docker Hub, so every new Pod wedges in
# ImagePullBackOff. Because maxUnavailable is 0, the rollout stalls at
# partial progress with the old ReplicaSet still serving: this is exactly the
# behaviour a rolling update is designed to produce.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freight-portal
  namespace: kcna-lab07
  labels:
    app: freight-portal
    tier: edge
  annotations:
    kubernetes.io/change-cause: "r24.3 - BROKEN image tag (deliberate)"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  minReadySeconds: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: freight-portal
      tier: edge
  template:
    metadata:
      labels:
        app: freight-portal
        tier: edge
        release: r24.3
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine-mfs-hotfix
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
      volumes:
        - name: site
          configMap:
            name: portal-site-r24-2
      terminationGracePeriodSeconds: 5
