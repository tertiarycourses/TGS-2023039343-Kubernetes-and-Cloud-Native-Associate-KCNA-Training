# Marina Freight Systems - Freight Portal, release r24.1 (revision 1).
# Serves data/site-r24.1.html via the ConfigMap "portal-site-r24-1", which the
# learner creates with `kubectl create configmap --from-file` in Step 2.
#
# Rollout arithmetic for this spec (replicas=4, maxSurge=1, maxUnavailable=1):
#   ceiling  = replicas + maxSurge        = 5 Pods may exist at once
#   floor    = replicas - maxUnavailable  = 3 Pods must stay Available
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freight-portal
  namespace: kcna-lab07
  labels:
    app: freight-portal
    tier: edge
  annotations:
    kubernetes.io/change-cause: "r24.1 - initial portal release"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  minReadySeconds: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: freight-portal
      tier: edge
  template:
    metadata:
      labels:
        app: freight-portal
        tier: edge
        release: r24.1
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
      volumes:
        - name: site
          configMap:
            name: portal-site-r24-1
      terminationGracePeriodSeconds: 5
