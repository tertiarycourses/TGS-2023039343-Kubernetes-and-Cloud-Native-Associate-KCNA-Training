# DELIBERATELY BROKEN - demonstrates that .spec.selector is IMMUTABLE on an
# existing apps/v1 Deployment. Everything else here is identical to r24.2;
# only the selector (and the matching template label) gained tier=frontend.
# Applying this over the live freight-portal Deployment is rejected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freight-portal
  namespace: kcna-lab07
  labels:
    app: freight-portal
    tier: frontend
  annotations:
    kubernetes.io/change-cause: "attempted selector change (deliberate failure)"
spec:
  replicas: 4
  revisionHistoryLimit: 3
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: freight-portal
      tier: frontend
  template:
    metadata:
      labels:
        app: freight-portal
        tier: frontend
        release: r24.2
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
      volumes:
        - name: site
          configMap:
            name: portal-site-r24-2
      terminationGracePeriodSeconds: 5
